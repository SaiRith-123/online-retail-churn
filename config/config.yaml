# Project configuration
data:
  raw_path: data/raw/online_retail_II.csv
  interim_path: data/interim/
  processed_path: data/processed/customer_features.parquet

cleaning:
  drop_null_customer_id: true
  drop_cancelled_invoices: true        # Invoice starts with 'C'
  drop_negative_quantity: true
  drop_non_positive_price: true
  drop_postage: true                   # StockCode == 'POST'

features:
  reference_date: "2011-12-10"         # end of observation window
  churn_threshold_days: 90             # no purchase in last 90 days => churn=1

model:
  test_size: 0.2
  random_state: 42
  cv_folds: 5
